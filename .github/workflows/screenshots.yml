name: App screenshots
# Real screenshots for the chat, of any web project: the model calls
# github_screenshot (engine/src/github.js) and this workflow opens the page in
# Chromium, runs the steps it was given and takes each picture
# (.github/scripts/screenshots.cjs, always taken from inhouselearn's main).
#
# What it photographs: a public URL (`url`), or a branch or commit of a
# repository (`repo`, empty = the repository running this workflow), served
# statically from its root (or `serve`), after an optional `setup` command
# (e.g. "npm ci && npm run build") or with its own server (`start`, which must
# listen on port 8765). Inhouse Learn itself is opened with OpenRouter mocked
# like tests/web, so a conversation can be replayed through the real renderer.
#
# Public repositories and URLs run here, in inhouselearn. A private repository
# runs this same file, copied into it as .github/workflows/inhouse-screenshots.yml
# (the app installs it, with the user's approval), so its code and its pictures
# never leave it. The PNGs and a manifest.json go to the `screenshots` branch
# of the repository running the workflow, under <id>/ (newest 30 kept).
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository to photograph, owner/name (empty = this one)
        type: string
        default: ''
      ref:
        description: Branch or commit to photograph (empty = default branch)
        type: string
        default: ''
      url:
        description: A public https URL to photograph instead of a repository
        type: string
        default: ''
      setup:
        description: Shell command run in the checkout first (e.g. npm ci && npm run build)
        type: string
        default: ''
      serve:
        description: Folder of the checkout to serve (default its root, e.g. dist)
        type: string
        default: ''
      start:
        description: Command that starts the project's own server on port 8765 (instead of serving files)
        type: string
        default: ''
      id:
        description: Folder for the pictures on the screenshots branch (letters, digits, . _ -)
        type: string
        required: true
      shots:
        description: 'JSON list of {name, path, device: phone|tablet|desktop, theme: light|dark, messages, steps, selector, fullPage}'
        type: string
        required: true

permissions:
  contents: read

# No concurrency group: GitHub would cancel a waiting run when a third one
# arrives. Runs go in parallel and the publish step retries its push.

jobs:
  # Runs the project's code (setup/start) with a read-only token that is not
  # kept on disk; only the pictures leave this job, as an artifact.
  shoot:
    # Playwright 1.56 supports Ubuntu 24.04, not ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check the inputs
        env:
          ID: ${{ inputs.id }}
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          URL: ${{ inputs.url }}
          SERVE: ${{ inputs.serve }}
        run: |
          [[ "$ID" =~ ^[A-Za-z0-9._-]{1,60}$ ]] || { echo "::error::id must be 1-60 letters, digits, . _ -"; exit 1; }
          [[ -z "$REPO" || "$REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::repo must be owner/name"; exit 1; }
          [[ -z "$REF" || "$REF" =~ ^[A-Za-z0-9._/-]{1,120}$ ]] || { echo "::error::ref must be a branch or a commit"; exit 1; }
          [[ -z "$URL" || "$URL" =~ ^https?://[^[:space:]]+$ ]] || { echo "::error::url must be an http(s) address"; exit 1; }
          [[ -z "$SERVE" || ( "$SERVE" =~ ^[A-Za-z0-9._/-]{1,120}$ && "$SERVE" != *..* ) ]] || { echo "::error::serve must be a folder of the checkout"; exit 1; }
      - name: Get the screenshot tool
        uses: actions/checkout@v5
        with:
          repository: miguelcoxcaballero/inhouselearn
          ref: main
          path: tool
          persist-credentials: false
      - name: Get the project
        if: inputs.url == ''
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repo != '' && inputs.repo || github.repository }}
          ref: ${{ inputs.ref }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        working-directory: tool
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prepare the project
        if: inputs.url == '' && inputs.setup != ''
        working-directory: app
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -c "$SETUP"
      - name: Take the pictures
        working-directory: tool
        env:
          ID: ${{ inputs.id }}
          TARGET: ${{ inputs.url == '' && (inputs.repo != '' && inputs.repo || github.repository) || '' }}
          REF: ${{ inputs.ref }}
          URL: ${{ inputs.url }}
          SERVE: ${{ inputs.serve }}
          START: ${{ inputs.start }}
          SHOTS: ${{ inputs.shots }}
        run: |
          if [ -z "$URL" ]; then
            if [ -n "$START" ]; then
              (cd ../app && nohup bash -c "$START" > ../server.log 2>&1 &)
              for _ in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
              curl -s -o /dev/null http://127.0.0.1:8765/ || { echo "::error::Nothing answers on port 8765 after 2 minutes"; tail -n 40 ../server.log; exit 1; }
            else
              [ -d "../app/$SERVE" ] || { echo "::error::The folder '$SERVE' does not exist (did setup build it?)"; exit 1; }
              (cd "../app/$SERVE" && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
              for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.2; done
            fi
          fi
          OUT="$GITHUB_WORKSPACE/out" node .github/scripts/screenshots.cjs
      - name: Keep them in the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/
          if-no-files-found: ignore

  # Only this job can write, and it runs nothing from the project.
  publish:
    needs: shoot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: out
      - name: Publish on the screenshots branch
        env:
          ID: ${{ inputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "out/$ID/manifest.json" ] || { echo "::error::No manifest for $ID"; exit 1; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another run may publish at the same time: start again from the new head.
          for attempt in 1 2 3 4 5 6; do
            rm -rf pub && mkdir pub && cd pub
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git fetch -q --depth 1 origin screenshots; then git checkout -q -B screenshots FETCH_HEAD; else git checkout -q --orphan screenshots; fi
            # Keep the newest folders only (ids start with a timestamp, so they sort by date).
            ls -1d */ 2>/dev/null | sed 's#/$##' | sort | head -n -29 | while read -r old; do git rm -rq "$old"; done
            rm -rf "$ID" && cp -r "../out/$ID" .
            git add -A
            git commit -qm "Screenshots $ID"
            if git push -q origin screenshots; then
              echo "Published: https://github.com/${GITHUB_REPOSITORY}/tree/screenshots/$ID"
              exit 0
            fi
            cd .. && sleep $((attempt * 3))
          done
          echo "::error::Could not publish on the screenshots branch"
          exit 1
