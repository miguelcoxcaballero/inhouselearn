name: Web tests
# Browser tests of the chat (tests/web) against the page served from this
# commit, with mocked OpenRouter, Google Drive and GitHub. Every FAIL line
# becomes an annotation, which the GitHub connector's github_ci_status reads.
on:
  push:
    paths-ignore:
      - 'android/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Playwright 1.56 supports Ubuntu 24.04, not ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run tests/web
        run: bash tests/web/run-ci.sh
      # Las capturas que hacen las pruebas son fotos reales de la app (Chromium,
      # tema claro y AMOLED): se quedan en el run para poder verlas y descargarlas.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
