name: Web tests
# Browser tests of the chat (tests/web) against the page served from this
# commit, with mocked OpenRouter, Google Drive and GitHub. Every FAIL line
# becomes an annotation, which the GitHub connector's github_ci_status reads.
on:
  push:
    paths-ignore:
      - 'android/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run tests/web
        run: bash tests/web/run-ci.sh
