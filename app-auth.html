<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f5f0">
  <title>inhouse learn</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      box-sizing: border-box; background: #f5f5f0; color: #1a1a1a; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    p { margin: 16px 0 0; font-size: 1rem; color: #555; }
    a {
      display: inline-block; margin-top: 20px; padding: 12px 22px; border-radius: 999px;
      background: #1a1a1a; color: #fff; font-weight: 600; text-decoration: none;
    }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="icons/favicon.svg" width="56" height="56" alt="">
    <p id="message">Volviendo a inhouse learn…</p>
    <a id="back" href="./" hidden>Volver a la app</a>
  </main>
  <script>
    // Google sign-in for the Android app (android/README.md): Google redirects
    // the Chrome Custom Tab here, and this page hands the result to the app
    // only (by package) as inhouselearn://auth?... The token is in the URL
    // fragment, so it never reaches a server; the app checks the state.
    (function () {
      var raw = location.hash.length > 1 ? location.hash.slice(1) : location.search.slice(1);
      history.replaceState(null, '', location.pathname);
      if (!raw) {
        document.getElementById('message').textContent = 'Abre inhouse learn para continuar.';
        document.getElementById('back').hidden = false;
        return;
      }
      var target = 'intent://auth?' + raw + '#Intent;scheme=inhouselearn;package=com.inhouse.learn;end';
      var back = document.getElementById('back');
      back.href = target;
      back.hidden = false;
      location.replace(target);
    })();
  </script>
</body>
</html>
