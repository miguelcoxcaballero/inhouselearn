<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Propuestas del compositor · inhouse learn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap');

  /* Tokens reales de la app (index.html + theme.css) */
  :root {
    --bg:#f5f5f0; --surface:#ffffff; --surface-hover:#fafaf8;
    --border:rgba(0,0,0,.06); --border-strong:rgba(0,0,0,.10);
    --text:#1a1a1a; --text-2:#555; --muted:#999; --ink-3:#6b6b66;
    --orange:#E07A3C; --orange-soft:rgba(224,122,60,.07); --orange-border:rgba(224,122,60,.22);
    --green:#15803d; --send-bg:var(--orange); --send-ink:#fff;
    --shadow:0 2px 12px rgba(0,0,0,.06); --shadow-lg:0 10px 34px rgba(0,0,0,.10);
    --r-xl:28px; --ease:cubic-bezier(.4,0,.2,1);
  }
  html[data-theme="dark"] {
    --bg:#000; --surface:#0d0d0c; --surface-hover:#171715;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.17);
    --text:#ece9e2; --text-2:#bab5aa; --muted:#8d887c; --ink-3:#a09a8d;
    --orange-soft:rgba(224,122,60,.14); --orange-border:rgba(224,122,60,.30);
    --green:#5fb978; --send-bg:#ece9e2; --send-ink:#111;
    --shadow:0 2px 12px rgba(0,0,0,.5); --shadow-lg:0 14px 40px rgba(0,0,0,.65);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  svg { display:block; }

  /* Marco de la app: barra superior, hilo, compositor */
  .app { height:100dvh; display:flex; flex-direction:column; }
  .top { height:56px; flex:none; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 12px; border-bottom:1px solid var(--border); }
  .chats-btn { justify-self:start; display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 15px 0 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border-strong); font-size:.875rem; font-weight:600; }
  .chats-btn svg { width:17px; height:17px; }
  .title { font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:1.18rem; letter-spacing:-.005em; }
  .avatar { justify-self:end; width:34px; height:34px; border-radius:50%; background:conic-gradient(from 225deg,#ea4335 0 90deg,#4285f4 90deg 180deg,#34a853 180deg 270deg,#fbbc04 270deg); padding:2px; }
  .avatar i { display:block; width:100%; height:100%; border-radius:50%; background:#6d5a48; border:1.5px solid var(--bg); }
  .thread { flex:1; min-height:0; overflow:hidden; padding:22px 18px 8px; display:flex; flex-direction:column; justify-content:flex-end; gap:16px; }
  .col { width:100%; max-width:720px; margin:0 auto; }
  .u { align-self:flex-end; max-width:82%; padding:10px 15px; border-radius:20px 20px 6px 20px; background:var(--surface-hover); border:1px solid var(--border); font-size:.92rem; line-height:1.5; }
  .a { font-size:.95rem; line-height:1.62; color:var(--text); }
  .a b { font-weight:600; }
  .a .meta { display:flex; align-items:center; gap:7px; margin-top:10px; font-size:.7rem; color:var(--muted); }
  .a .meta img { width:15px; height:15px; }
  .a .meta .c { color:var(--green); font-variant-numeric:tabular-nums; }
  .a .meta .c i { color:var(--muted); font-style:normal; }

  /* Piezas del compositor, compartidas */
  .dock { flex:none; padding:10px 18px max(16px,env(safe-area-inset-bottom)); }
  .caret { display:inline-block; width:1.5px; height:1em; margin-left:1px; vertical-align:-.12em; background:currentColor; animation:blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .tx { font-size:1rem; line-height:1.5; color:var(--text); }
  .ph { font-family:'Newsreader',Georgia,serif; font-style:italic; font-size:1.06rem; color:var(--muted); }
  .gr { flex:1 1 auto; min-width:0; }
  .plus,.mic { flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--border-strong); display:inline-flex; align-items:center; justify-content:center; color:var(--text); transition:background .18s var(--ease); }
  .plus:hover,.mic:hover { background:var(--surface-hover); }
  .plus svg { width:19px; height:19px; } .mic svg { width:18px; height:18px; color:var(--text-2); }
  .mic.bare,.plus.bare { border-color:transparent; }
  .send { flex:none; height:44px; padding:0 20px 0 22px; border-radius:999px; background:var(--send-bg); color:var(--send-ink); display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:.95rem; }
  .send svg { width:16px; height:16px; }
  .send.o { width:42px; height:42px; padding:0; justify-content:center; }
  .send.o svg { width:18px; height:18px; }
  .logo { flex:none; width:24px; height:24px; border-radius:50%; background:var(--surface-hover); border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; }
  html[data-theme="dark"] .logo { background:#17171a; }
  .logo img { width:14px; height:14px; }
  .lvl { font-size:.7rem; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--orange-soft); color:var(--orange); border:1px solid var(--orange-border); }
  html[data-theme="dark"] .lvl { color:#f0a878; }
  .cost { font-size:.68rem; font-weight:600; color:var(--green); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cost i { font-style:normal; color:var(--muted); font-weight:500; }
  .caps { font:500 .66rem 'DM Sans',sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
  .chev { width:13px; height:13px; color:var(--muted); }

  /* A · Editorial — la tinta sobre papel, sin cajas */
  .A { border-top:1px solid var(--border); padding-top:14px; }
  .A .tx,.A .ph { padding:2px 2px 14px; min-height:34px; }
  .A .row { display:flex; align-items:center; gap:10px; }
  .A .model { display:inline-flex; align-items:center; gap:9px; height:40px; padding:0 4px; min-width:0; }
  .A .model b { font-size:.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .A .model .lv { font:600 .66rem 'DM Sans'; letter-spacing:.09em; text-transform:uppercase; color:var(--orange); }
  html[data-theme="dark"] .A .model .lv { color:#f0a878; }

  /* B · Cápsula — una tarjeta flotante, el gasto como pestaña */
  .B { position:relative; margin-top:12px; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); padding:16px 14px 12px 20px; transition:border-color .2s,box-shadow .2s; }
  .B:focus-within,.B.on { border-color:var(--orange-border); box-shadow:0 0 0 3px var(--orange-soft),var(--shadow-lg); }
  .B .tab { position:absolute; top:-12px; right:24px; display:inline-flex; align-items:center; gap:6px; height:23px; padding:0 10px; border-radius:999px; background:var(--bg); border:1px solid var(--border-strong); }
  .B .tx,.B .ph { min-height:34px; padding-right:6px; }
  .B .row { display:flex; align-items:center; gap:8px; margin-top:12px; padding-right:2px; }
  .B .model { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 11px 0 6px; border-radius:999px; border:1px solid var(--border-strong); font-size:.8rem; font-weight:600; min-width:0; }
  .B .model span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .B .plus,.B .mic { width:38px; height:38px; }

  /* C · Índice — el modelo y el gasto como una línea de contenido, con guía de puntos */
  .C { border-top:1px solid var(--border); padding-top:12px; }
  .C .idx { display:flex; align-items:center; gap:9px; padding:0 2px 10px; }
  .C .idx .lead { flex:1 1 12px; min-width:12px; border-bottom:1.5px dotted var(--border-strong); opacity:.8; transform:translateY(3px); }
  .C .idx .nm { color:var(--text-2); font-weight:600; }
  .C .idx .lv { color:var(--orange); font-weight:600; }
  html[data-theme="dark"] .C .idx .lv { color:#f0a878; }
  .C .idx .logo { width:20px; height:20px; } .C .idx .logo img { width:12px; height:12px; }
  .C .tx,.C .ph { padding:2px 2px 14px; min-height:34px; }
  .C .row { display:flex; align-items:center; gap:8px; }

  /* D · Compacta — una línea en reposo, se despliega al escribir */
  .D { background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-xl); box-shadow:var(--shadow); padding:7px 8px 7px 7px; }
  .D.empty { display:flex; align-items:center; gap:8px; }
  .D.empty .ph { flex:1 1 auto; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .D .chip { flex:none; position:relative; width:40px; height:40px; border-radius:50%; border:1px solid var(--border-strong); display:inline-flex; align-items:center; justify-content:center; }
  .D .chip .logo { width:26px; height:26px; border:0; } .D .chip .logo img { width:15px; height:15px; }
  .D .chip::after { content:''; position:absolute; right:1px; top:1px; width:9px; height:9px; border-radius:50%; background:var(--orange); border:2px solid var(--surface); }
  .D.open { padding:14px 10px 8px 18px; }
  .D.open .tx { min-height:34px; padding-right:8px; }
  .D.open .row { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .D.open .model { display:inline-flex; align-items:center; gap:8px; min-width:0; font-size:.78rem; color:var(--text-2); }
  .D.open .model b { font-weight:600; color:var(--text); white-space:nowrap; }
  .D.open .model .dot { width:3px; height:3px; border-radius:50%; background:var(--border-strong); }

  @media (min-width:700px) { .dock { padding-left:24px; padding-right:24px; } .thread { padding:30px 24px 10px; } .top { padding:0 18px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="chats-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Chats</span>
    <span class="title">Momento de inercia</span>
    <span class="avatar"><i></i></span>
  </header>
  <main class="thread">
    <div class="col" style="display:flex;flex-direction:column;gap:16px">
      <div class="u">¿Por qué el momento de inercia de un disco es ½·m·R²?</div>
      <div class="a">Porque la masa se reparte desde el centro hasta el borde: integras r²·dm sobre todo el disco y, como dm = σ·2πr·dr, te queda <b>½·m·R²</b>. Un aro, con toda la masa en el borde, da m·R².
        <div class="meta"><img src="icons/companies/deepseek.svg" alt="">DeepSeek V4.1 Flash <span class="c">$0.00<i>41</i></span></div>
      </div>
    </div>
  </main>
  <footer class="dock"><div class="col" id="slot"></div></footer>
</div>

<script>
  window.runAssistantTurn = window.runAssistantTurn || function () {};
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const p = q.get('p') || 'A';
  const state = q.get('state') || 'typed';
  const TEXT = 'quiero que reestructures ahora la parte donde escribo el prompt para que se vea menos sobrecargado, más ordenado y bonito';
  const I = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3.5a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0v-5a3 3 0 0 1 3-3z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
  };
  const logo = '<span class="logo"><img src="icons/companies/deepseek.svg" alt=""></span>';
  const cost = '<span class="cost">$2.63<i>82</i></span>';
  const text = '<div class="tx">' + TEXT + '<span class="caret"></span></div>';
  const ph = '<div class="ph">¿Qué estudiamos hoy?</div>';
  const body = state === 'empty' ? ph : text;
  const sendP = '<button class="send">Enviar ' + I.up + '</button>';
  const sendO = '<button class="send o" aria-label="Enviar">' + I.up + '</button>';
  const V = {
    A: '<div class="A">' + body + '<div class="row"><button class="plus">' + I.plus + '</button>' +
       '<button class="model">' + logo + '<b>DeepSeek V4.1 Flash</b><span class="lv">Alto</span>' + I.chev + '</button><span class="gr"></span>' +
       cost + '<button class="mic bare">' + I.mic + '</button>' + sendP + '</div></div>',
    B: '<div class="B on"><span class="tab">' + cost + '</span>' + body +
       '<div class="row"><button class="plus">' + I.plus + '</button><button class="model">' + logo + '<span>DeepSeek V4.1 Flash</span><span class="lvl">Alto</span>' + I.chev + '</button>' +
       '<span class="gr"></span><button class="mic bare">' + I.mic + '</button>' + sendO + '</div></div>',
    C: '<div class="C"><div class="idx">' + logo + '<span class="caps nm">DeepSeek V4.1 Flash</span><span class="lead"></span><span class="caps lv">Alto</span><span class="caps">·</span>' + cost + '</div>' + body +
       '<div class="row"><button class="plus">' + I.plus + '</button><span class="gr"></span><button class="mic bare">' + I.mic + '</button>' + sendP + '</div></div>',
    D: state === 'empty'
      ? '<div class="D empty"><button class="plus bare">' + I.plus + '</button>' + ph + '<button class="chip" aria-label="Modelo">' + logo + '</button><button class="mic bare">' + I.mic + '</button>' + sendO + '</div>'
      : '<div class="D open">' + text + '<div class="row"><button class="plus">' + I.plus + '</button><span class="model">' + logo + '<b>Flash</b><span class="dot"></span><span>Alto</span><span class="dot"></span>' + cost + '</span><span class="gr"></span><button class="mic bare">' + I.mic + '</button>' + sendO + '</div></div>'
  };
  document.getElementById('slot').innerHTML = V[p] || V.A;
</script>
</body>
</html>
